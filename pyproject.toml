[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.6.0"
description = "Fetch and match jobs from public ATS boards (Greenhouse, Lever, Ashby, Workable, Rippling, Workday) with pluggable boards, keyword filters, an optional LLM judge, and aggregator-based company discovery."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wokhouse" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "workable", "rippling", "workday", "job-search", "job-discovery"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[project.urls]
Homepage = "https://github.com/wokhouse/jobhunt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
